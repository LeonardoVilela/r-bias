experiment:
  name: rbias-synthetic-example
  scenarios: ../data/samples/synthetic_scenarios.json
  models: ../configs/models.yaml
  encoders: ../configs/encoders.yaml
  expected_scenarios: 2
  expected_prompt_variants: 10
  expected_strict_scenarios: 1
  expected_implicit_scenarios: 1

generation:
  n_samples: 5
  temperature: 0.7
  top_p: 1.0
  max_tokens: 512
  concurrency: 2
  max_retries: 2

permutation:
  n_permutations: 100
  seed: 42

sentiment:
  primary: cardiffnlp/twitter-xlm-roberta-base-sentiment
  fallback: pysentimiento/bertweet-pt-sentiment

refusal_lexicon:
  - "não posso"

